<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event</title>
    <link rel="stylesheet" href="../css/modal.css">
</head>
<body>
    <div id="editEventModal" class="modal modal-large show">
        <div class="modal-content modal-content-large">
            <div class="modal-header">
                <h2>Edit Event</h2>
                <span class="close" onclick="closeModal('editEventModal')">✕</span>
            </div>
            
            <form id="editEventForm" class="event-form">
                <input type="hidden" id="eventId" name="event_id">

                <div class="form-group">
                    <label for="eventName">Event Name</label>
                    <input type="text" id="eventName" name="eventName" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="eventLocation">Location</label>
                        <input type="text" id="eventLocation" name="eventLocation" required>
                    </div>
                    <div class="form-group">
                        <label for="eventCategory">Category</label>
                        <select id="eventCategory" name="eventCategory" required>
                            <option value="sports">Sports</option>
                            <option value="academic">Academic</option>
                            <option value="cultural">Cultural</option>
                            <option value="social">Social</option>
                            <option value="technical">Technical</option>
                            <option value="workshop">Workshop</option>
                            <option value="seminar">Seminar</option>
                            <option value="music">Music</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" name="eventDescription" rows="4" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="eventDate">Date</label>
                        <input type="date" id="eventDate" name="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label for="eventTime">Time</label>
                        <input type="time" id="eventTime" name="eventTime">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="volunteersNeeded">Volunteers Needed</label>
                        <input type="number" id="volunteersNeeded" name="volunteersNeeded" min="0">
                    </div>
                    <div class="form-group">
                        <label for="eventPhoto">New Event Photo (optional)</label>
                        <input type="file" id="eventPhoto" name="eventPhoto" accept="image/*">
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-action">Update Event</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
