<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <link rel="stylesheet" href="../css/modal.css">
</head>
<body>
    <div id="editUserModal" class="modal modal-large show">
        <div class="modal-content modal-content-large">
            <div class="modal-header">
                <h2>Edit User</h2>
                <span class="close" onclick="closeEditUserModal()">✕</span>
            </div>
            
            <form id="editUserForm" class="event-form" enctype="multipart/form-data">
                <input type="hidden" id="userId" name="user_id">

                <div class="form-group">
                    <label for="userName">Full Name</label>
                    <input type="text" id="userName" name="uname" required>
                </div>

                <div class="form-group">
                    <label for="userEmail">Email</label>
                    <input type="email" id="userEmail" name="email" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="userPhone">Phone</label>
                        <input type="text" id="userPhone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="userRole">Role</label>
                        <select id="userRole" name="role" required>
                            <option value="student">Student</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="userAddress">Address</label>
                    <textarea id="userAddress" name="address" rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="userPhoto">Profile Photo (optional)</label>
                        <input type="file" id="userPhoto" name="photo" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label for="userPassword">New Password (leave blank to keep current)</label>
                        <input type="password" id="userPassword" name="password" placeholder="Enter new password">
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-action">Update User</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function closeEditUserModal() {
            closeModal('editUserModal');
        }
    </script>
</body>
</html>
