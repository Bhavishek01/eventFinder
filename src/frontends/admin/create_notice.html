<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publish Notice</title>
    <link rel="stylesheet" href="../css/modal.css">
</head>
<body>
    <div id="createNoticeModal" class="modal modal-large show">
        <div class="modal-content modal-content-large">
            <div class="modal-header">
                <h2>Publish New Notice</h2>
                <span class="close" onclick="closeModal('createNoticeModal')">✕</span>
            </div>
            
            <form id="createNoticeForm" class="event-form">
                <div class="form-group">
                    <label for="noticeSubject">Subject</label>
                    <input type="text" id="noticeSubject" name="subject" required placeholder="Enter notice subject">
                </div>

                <div class="form-group">
                    <label for="noticeBody">Notice Body</label>
                    <textarea id="noticeBody" name="body" rows="8" required placeholder="Write the full notice content..."></textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-action">Publish Notice</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
