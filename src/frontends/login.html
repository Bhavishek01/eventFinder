<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventFinder - Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-S..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- Theme Toggle Button -->
    <div class="theme-toggle">
        <button id="themeToggle" class="theme-btn" onclick="toggleThemeBtn()">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
    </div>

    <div class="login-container">
        <h1>EventFinder</h1>
        <p>Sign in to your account</p>

        <div id="loginError" class="error-message" style="display:none;"></div>

        <form id="loginForm" action="../php/login.php" method="post">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group password-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <i class="fa-solid fa-eye-slash toggle-password" id="toggleLoginPassword"></i>
                </div>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn">Sign In</button>
        </form>

        <p class="signup-link">
            Don't have an account? <a href="signup.html">Sign up</a>
        </p>
    </div>
    <script src="../js/toggle_modes.js"></script>
    <script src="../js/valid1.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            const errorDiv = document.getElementById('loginError');

            // Check if error came from PHP redirect
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('error')) {
                showError('Invalid email or password. Please try again.');
            }

            form.addEventListener('submit', function() {
                errorDiv.style.display = 'none';
            });
        });

        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            errorDiv.style.background = '#ffebee';
            errorDiv.style.color = '#c62828';
            errorDiv.style.padding = '12px';
            errorDiv.style.borderRadius = '6px';
            errorDiv.style.marginBottom = '15px';
            errorDiv.style.textAlign = 'center';
        }

    </script>
</body>
</html>
