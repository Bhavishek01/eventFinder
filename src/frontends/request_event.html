<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request New Event</title>
    <link rel="stylesheet" href="../css/modal.css">
</head>
<body>
    <div id="requestEventModal" class="modal modal-large show">
        <div class="modal-content modal-content-large">
            <div class="modal-header">
                <h2>Request New Event</h2>
                <span class="close" onclick="closeRequestEventModal()">✕</span>
            </div>
            
            <form id="requestEventForm" class="event-form">
                <div class="form-group">
                    <label for="reqEventName">Event Name</label>
                    <input type="text" id="reqEventName" name="eventName" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="reqEventLocation">Location / Venue</label>
                        <input type="text" id="reqEventLocation" name="eventLocation" required>
                    </div>
                    <div class="form-group">
                        <label for="reqEventCategory">Category</label>
                        <select id="reqEventCategory" name="eventCategory" required>
                            <option value="">Select category</option>
                            <option value="sports">Sports</option>
                            <option value="academic">Academic</option>
                            <option value="cultural">Cultural</option>
                            <option value="social">Social</option>
                            <option value="technical">Technical</option>
                            <option value="workshop">Workshop</option>
                            <option value="seminar">Seminar</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reqEventDescription">Description</label>
                    <textarea id="reqEventDescription" name="eventDescription" rows="5" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="reqEventDate">Proposed Date</label>
                        <input type="date" id="reqEventDate" name="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label for="reqEventTime">Proposed Time</label>
                        <input type="time" id="reqEventTime" name="eventTime" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reqVolunteers">Volunteers Needed (optional)</label>
                    <input type="number" id="reqVolunteers" name="volunteersNeeded" min="0" value="0">
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-action">Submit Request</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function closeRequestEventModal() {
            closeModal('requestEventModal');
        }
    </script>
</body>
</html>
