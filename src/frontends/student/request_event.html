<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request New Event</title>
    <link rel="stylesheet" href="../../css/modal.css">
</head>
<body>
    <div id="requestEventModal" class="modal modal-large show">
        <div class="modal-content modal-content-large">
            <div class="modal-header-req">
    
                <!-- Top row -->
                <div class="header-top">
                    <h2>Request New Event</h2>
                    <span class="close" onclick="closeModal('requestEventModal')">✕</span>
                </div>

                <!-- Bottom row -->
                <button class="btn btn-action history-btn"
                        onclick="openHistoryModal('eventRequest')">
                    History
                </button>

            </div>
            
            <form id="requestEventForm" class="event-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="eventName">Event Name</label>
                    <input type="text" id="eventName" name="eventName" required placeholder="Enter event name">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="eventLocation">Location</label>
                        <input type="text" id="eventLocation" name="eventLocation" required placeholder="Enter event location">
                    </div>
                    <div class="form-group">
                        <label for="eventCategory">Category</label>
                        <select id="eventCategory" name="eventCategory" required>
                            <option value="">Select category</option>
                            <option value="sports">Sports</option>
                            <option value="academic">Academic</option>
                            <option value="cultural">Cultural</option>
                            <option value="social">Social</option>
                            <option value="technical">Technical</option>
                            <option value="workshop">Workshop</option>
                            <option value="seminar">Seminar</option>
                            <option value="music">Music</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" name="eventDescription" rows="4" required placeholder="Enter event description"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="eventDate">Date</label>
                        <input type="date" id="eventDate" name="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label for="eventTime">Time</label>
                        <input type="time" id="eventTime" name="eventTime">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="volunteersNeeded">Volunteers Needed</label>
                        <input type="number" id="volunteersNeeded" name="volunteersNeeded" min="0" placeholder="Enter number of volunteers">
                    </div>
                    <div class="form-group">
                        <label for="eventPhoto">Event Photo</label>
                        <input type="file" id="eventPhoto" name="eventPhoto" accept="image/*">
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-action">Submit Request</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
