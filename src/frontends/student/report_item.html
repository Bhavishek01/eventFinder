<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Item</title>
    <link rel="stylesheet" href="../css/modal.css">
</head>
<body>
    <div id="reportItemModal" class="modal modal-large show">
        <div class="modal-content modal-content-large">
            <div class="modal-header">
                <h2>Report Lost or Found Item</h2>
                <span class="close" onclick="closeModal('reportItemModal')"">✕</span>
            </div>
            
            <form id="reportItemForm" class="event-form" enctype="multipart/form-data">
                <input type="hidden" id="reportEventId" name="event_id">
                <input type="hidden" id="reportEventDate" name="event_date">

                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" name="item_name" required placeholder="e.g. Blue Water Bottle">
                </div>

                <div class="form-group">
                    <label for="itemDescription">Description</label>
                    <textarea id="itemDescription" name="description" rows="4" required placeholder="Describe the item..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="itemLocation">Location</label>
                        <input type="text" id="itemLocation" name="location" required placeholder="Where was it lost/found?">
                    </div>
                    <div class="form-group">
                        <label for="itemPhoto">Photo (optional)</label>
                        <input type="file" id="itemPhoto" name="item_photo" accept="image/*">
                    </div>
                </div>
                <div class="form-buttons" style="display:flex; gap:15px;">
                    <button type="button" class="btn btn-action" onclick="submitItemReport('lost')" 
                            style="flex:1; background:#d9534f;">Report as LOST</button>
                    <button type="button" class="btn btn-action" onclick="submitItemReport('found')" 
                            style="flex:1;">Report as FOUND</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
