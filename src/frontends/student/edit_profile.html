<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="../../css/modal.css">
</head>
<body>
    <div id="editProfileModal" class="modal modal-large show">
        <div class="modal-content modal-content-large">
            <div class="modal-header">
                <h2>Edit Profile</h2>
                <span class="close" onclick="closeEditProfileModal()">✕</span>
            </div>
            
            <form id="editProfileForm" class="event-form" enctype="multipart/form-data">
                <input type="hidden" id="profileUserId" name="user_id">

                <div class="form-group">
                    <label for="profileName">Full Name</label>
                    <input type="text" id="profileName" name="uname" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="profilePhone">Phone Number</label>
                        <input type="text" id="profilePhone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="profileAddress">Address</label>
                        <input type="text" id="profileAddress" name="address" placeholder="Enter your address">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="profilePhoto">Profile Photo (optional)</label>
                        <input type="file" id="profilePhoto" name="photo" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label for="profilePassword">New Password (optional)</label>
                        <input type="password" id="profilePassword" name="password" 
                               placeholder="Leave blank to keep current">
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-action">Update Profile</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function closeEditProfileModal() {
            closeModal('editProfileModal');
        }
    </script>
</body>
</html>
